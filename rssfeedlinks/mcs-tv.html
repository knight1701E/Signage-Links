<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCS TV</title>
<!-- MCS Build Main Screen TV box (Knightsoft CMS). Plays on its own: no play button, no controls.
     Tries sound first; if the browser blocks sound it plays muted instead, so it never sits on a black box.
     A watchdog reloads the stream if the picture freezes. -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
</style>
</head>
<body>
<video id="tv" autoplay muted playsinline></video>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(function () {
  var SRC = 'https://vs-hls-push-uk-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8';
  var v = document.getElementById('tv');
  var hls = null;

  // Start with sound where the screen allows it; otherwise play muted.
  function play() {
    v.muted = false;
    var p = v.play();
    if (p && p.catch) {
      p.catch(function () {
        v.muted = true;
        v.play().catch(function () {});
      });
    }
  }

  function load() {
    if (hls) { hls.destroy(); hls = null; }
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3, enableWorker: true });
      hls.on(Hls.Events.MANIFEST_PARSED, play);
      hls.on(Hls.Events.ERROR, function (e, data) {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { setTimeout(function () { hls.startLoad(); }, 3000); }
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
        else { setTimeout(load, 5000); }
      });
      hls.loadSource(SRC);
      hls.attachMedia(v);
    } else {
      v.src = SRC;
      v.addEventListener('loadedmetadata', play, { once: true });
    }
  }

  // Watchdog: if the picture hasn't moved for 30 s, reload the stream.
  var last = -1, still = 0;
  setInterval(function () {
    if (v.currentTime === last) { still += 10; } else { still = 0; last = v.currentTime; }
    if (v.paused) { play(); }
    if (still >= 30) { still = 0; load(); }
  }, 10000);

  load();
})();
</script>
</body>
</html>
