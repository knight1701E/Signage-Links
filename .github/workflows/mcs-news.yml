name: MCS news feed
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/mcs_news.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "signage-bot"
          git config user.email "signage-bot@users.noreply.github.com"
          git add rssfeedlinks/mcs-news.json
          git commit -m "MCS news update"
          git push
